# Pinned sources for Igloo's FFmpeg build. One source per line:
#   name  kind  ref  sha256  url  # upstream release
# kind=tar: ref is the version and sha256 is the tarball digest.
# kind=git: ref is the full commit; sha256 is "-" because the commit pins the tree.
# Each git dependency is pinned to the commit of an upstream release tag, named
# in the trailing comment. The exceptions say why: x264 publishes no releases
# (its master is what everyone ships, and its stable branch is older), zimg's
# last tag predates memory-safety fixes in code zscale runs, and Implib.so has
# no releases.
