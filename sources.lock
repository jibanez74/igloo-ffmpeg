x264       git  0480cb05fa188d37ae87e8f4fd8f1aea3711f7ee  -  https://code.videolan.org/videolan/x264.git           # master, 2025-09-10 (no releases)
zimg       git  67e0603271c080e22c8429856dd4a8a56587e61e  -  https://github.com/sekrit-twc/zimg.git                # master, after release-3.0.6 (untagged fixes)
