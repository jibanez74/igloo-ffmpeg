name: Build

# Builds Igloo's ffmpeg and ffprobe and checks them. Pushing a
# media-<FFmpeg version>-igloo.<n> tag also publishes them as a GitHub release,
# which Igloo's media-payloads/payloads.lock then pins for `make media-payloads`.
on:
  push:
    branches: ['**']
    tags: ['media-*']
    # GitHub ignores path filters for tag pushes, so every media-* tag builds.
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build
        run: ./build.sh

      - name: Check components and linkage
        run: |
          out=out/linux_amd64
          python3 -I verify/check-features.py verify/required-features.txt "$out/ffmpeg"
          verify/check-linkage.sh "$out/ffmpeg" "$out/ffprobe"

      - name: Smoke test
        run: |
          out=out/linux_amd64
          "$out/ffmpeg" -hide_banner -version | head -1
          "$out/ffmpeg" -hide_banner -v error -f lavfi -i testsrc2=s=320x240:d=1 -f lavfi -i sine=d=1 \
            -c:v libx264 -c:a aac -f mp4 "$RUNNER_TEMP/smoke.mp4"
          "$out/ffprobe" -v error -show_entries stream=codec_name -of csv=p=0 "$RUNNER_TEMP/smoke.mp4"

      - name: Stage release files
        run: |
          out=out
          mkdir release
          cp "$out/linux_amd64/ffmpeg" release/ffmpeg_linux_amd64
          cp "$out/linux_amd64/ffprobe" release/ffprobe_linux_amd64
          cp "$out/linux_amd64/BUILDINFO" release/BUILDINFO_linux_amd64
          cp "$out"/igloo-ffmpeg-*-sources.tar release/
          cd release
          files=(*)
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: media-linux_amd64
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: linux-amd64
    if: startsWith(github.ref, 'refs/tags/media-')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: media-linux_amd64
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(awk '$1 == "ffmpeg" { print $3 }' sources.lock)
          if [[ ! $TAG =~ ^media-${version//./\\.}-igloo\.[0-9]+$ ]]; then
            echo "::error::$TAG does not name FFmpeg $version, the version in sources.lock"
            exit 1
          fi
          (cd release && sha256sum -c SHA256SUMS)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          FFmpeg $version built by [igloo-ffmpeg](https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA) for Igloo's Linux x64 release binaries, from commit $GITHUB_SHA.

          | File | Contents |
          | --- | --- |
          | \`ffmpeg_linux_amd64\`, \`ffprobe_linux_amd64\` | Executables. Everything but glibc is linked in, and they need glibc 2.28 or newer. |
          | \`BUILDINFO_linux_amd64\` | Toolchain, configure line, source pins and patch digests |
          | \`igloo-ffmpeg-$version-sources.tar\` | Corresponding source under the GPL: every source tarball, the patches and the build recipe |
          | \`SHA256SUMS\` | Checksums of the files above |

          Igloo's \`make media-payloads\` installs the executables after checking them against [\`media-payloads/payloads.lock\`](https://github.com/jibanez74/Igloo/blob/dev/media-payloads/payloads.lock).
          EOF
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "FFmpeg $version for Igloo (${TAG#media-"$version"-})" --notes-file "$RUNNER_TEMP/notes.md"
